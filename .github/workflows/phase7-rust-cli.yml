name: Phase 7 Rust Design CLI

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_BUILD_JOBS: "4"
  RUST_TEST_THREADS: "2"

permissions:
  contents: read

jobs:
  rust-cli:
    name: Installed Windows x64 Rust design CLI
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Restore the reviewed KiCad corpus archive
        shell: pwsh
        run: |
          uv run python scripts/kicad_corpus_archive.py restore --check-zip
          $corpus = Join-Path $env:GITHUB_WORKSPACE 'tests\corpus\kicad.zip'
          "KM_CORPUS=$corpus" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build, install, and smoke the pure-Rust CLI
        shell: pwsh
        run: |
          uv run --package kicad-cruncher python `
            packages/kicad_cruncher/tests/support_scripts/rust_cli_install_test.py `
            --workspace $env:GITHUB_WORKSPACE `
            --artifact-dir phase7-dist `
            --git-sha $env:GITHUB_SHA
      - name: Run strict Rust gates
        run: |
          cargo fmt --all -- --check
          cargo clippy -p kicad-cruncher-cli --all-targets -- -D warnings
          cargo test -p kicad-cruncher-cli --all-targets
      - name: Verify the hash-bound release candidate
        shell: pwsh
        run: |
          $version = (& uv run python -c "import tomllib; print(tomllib.load(open('packages/kicad_cruncher/pyproject.toml','rb'))['project']['version'])").Trim()
          uv run python scripts/verify_phase7_rust_cli.py phase7-dist `
            --git-sha $env:GITHUB_SHA --expected-version $version
      - uses: actions/upload-artifact@v4
        with:
          name: phase7-rust-cli-windows-x64
          path: phase7-dist/*
          if-no-files-found: error
          retention-days: 14
