name: PR Hygiene

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  hygiene:
    name: metadata and commit hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out history for import-boundary validation
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check PR metadata and commits
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const failures = [];

            const bannedPatterns = [
              { pattern: /\bclaude\b/i, message: "mentions Claude" },
              { pattern: /\banthropic\b/i, message: "mentions Anthropic" },
              { pattern: /\bgenerated\s+with\b/i, message: "uses generated-with attribution" },
              { pattern: /\bco-authored-by:\s*(claude|anthropic)\b/i, message: "uses AI-vendor co-author attribution" },
            ];
            const emojiPattern = /[\p{Extended_Pictographic}\uFE0F]/u;
            const conventionalSubjectPattern = /^(build|chore|ci|deps|docs|feat|fix|perf|refactor|release|revert|style|test)(\([A-Za-z0-9._-]+\))?!?: .+$/;
            const historyImportLabel = pr.labels.some(
              (label) => label.name === "history-import",
            );
            const historyImportLine = (pr.body || "")
              .split(/\r?\n/)
              .find((line) => /^Imported history head:/i.test(line));
            const historyImportMatch = historyImportLine
              ? /^Imported history head:\s*`?([0-9a-f]{40})`?\s*$/i.exec(historyImportLine)
              : null;
            let importedHistoryHead = historyImportMatch
              ? historyImportMatch[1].toLowerCase()
              : null;

            if (historyImportLine && !historyImportLabel) {
              failures.push("`Imported history head:` requires the maintainer-applied `history-import` label.");
              importedHistoryHead = null;
            }
            if (historyImportLabel && !importedHistoryHead) {
              failures.push("The `history-import` label requires `Imported history head:` with a full 40-character commit SHA.");
            }

            function checkConventionalSubject(label, subject) {
              if (!conventionalSubjectPattern.test(subject || "")) {
                failures.push(`${label} must use Conventional Commit form, for example \`fix: handle missing board outline\`.`);
              }
            }

            function checkText(label, text) {
              const value = text || "";
              if (emojiPattern.test(value)) {
                failures.push(`${label} contains emoji or pictographic symbols.`);
              }
              for (const { pattern, message } of bannedPatterns) {
                if (pattern.test(value)) {
                  failures.push(`${label} ${message}.`);
                }
              }
            }

            function issueNumbersFrom(text) {
              const value = text || "";
              const numbers = new Set();
              const sameRepoIssueUrl = new RegExp(
                `https://github\\.com/${owner}/${repo}/issues/(\\d+)`,
                "gi",
              );
              for (const match of value.matchAll(sameRepoIssueUrl)) {
                numbers.add(Number(match[1]));
              }
              for (const match of value.matchAll(/(^|[^\w/])#(\d+)\b/g)) {
                numbers.add(Number(match[2]));
              }
              return [...numbers];
            }

            checkText("PR title", pr.title);
            checkText("PR body", pr.body || "");
            checkConventionalSubject("PR title", pr.title || "");

            const linkedIssueLine = (pr.body || "")
              .split(/\r?\n/)
              .find((line) => /^Linked issue:/i.test(line));
            const issueNumbers = issueNumbersFrom(linkedIssueLine || "");
            if (!linkedIssueLine || issueNumbers.length === 0) {
              failures.push("PR body must fill in `Linked issue:` with an existing same-repo issue such as `#123`.");
            }

            for (const issueNumber of issueNumbers) {
              try {
                const response = await github.rest.issues.get({
                  owner,
                  repo,
                  issue_number: issueNumber,
                });
                if (response.data.pull_request) {
                  failures.push(`#${issueNumber} is a pull request, not an issue.`);
                }
              } catch (error) {
                failures.push(`Linked issue #${issueNumber} does not exist or is not readable.`);
              }
            }

            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100,
            });
            if (importedHistoryHead && historyImportLabel) {
              const importedHeadIsInPullRequest = commits.some(
                (commit) => commit.sha.toLowerCase() === importedHistoryHead,
              );
              if (!importedHeadIsInPullRequest) {
                failures.push("`Imported history head:` is not a commit in this pull request.");
                importedHistoryHead = null;
              } else {
                let importedHeadIsMergeParent = false;
                for (const commit of commits) {
                  const result = await exec.getExecOutput(
                    "git",
                    ["show", "-s", "--format=%P", commit.sha],
                    { ignoreReturnCode: true, silent: true },
                  );
                  const parents = result.stdout.trim().toLowerCase().split(/\s+/);
                  if (result.exitCode === 0 && parents.slice(1).includes(importedHistoryHead)) {
                    importedHeadIsMergeParent = true;
                    break;
                  }
                }
                if (!importedHeadIsMergeParent) {
                  failures.push("`Imported history head:` must be a non-first parent of a merge commit in this pull request.");
                  importedHistoryHead = null;
                }
              }
            }

            let exemptedHistoryCommits = 0;
            for (const commit of commits) {
              if (importedHistoryHead) {
                const ancestry = await exec.getExecOutput(
                  "git",
                  ["merge-base", "--is-ancestor", commit.sha, importedHistoryHead],
                  { ignoreReturnCode: true, silent: true },
                );
                if (ancestry.exitCode === 0) {
                  exemptedHistoryCommits += 1;
                  continue;
                }
              }
              const message = commit.commit.message || "";
              const subject = message.split(/\r?\n/, 1)[0];
              checkText(`Commit ${commit.sha.slice(0, 7)} message`, message);
              checkConventionalSubject(`Commit ${commit.sha.slice(0, 7)} subject`, subject);
              if (subject.length > 72) {
                failures.push(`Commit ${commit.sha.slice(0, 7)} subject is ${subject.length} characters; keep it at 72 or fewer.`);
              }
              if (/^wip\b/i.test(subject)) {
                failures.push(`Commit ${commit.sha.slice(0, 7)} subject starts with WIP.`);
              }
            }
            if (exemptedHistoryCommits > 0) {
              core.notice(`Preserved ${exemptedHistoryCommits} imported-history commits; normal hygiene remained active outside that ancestry.`);
            }

            if (failures.length > 0) {
              core.setFailed(`PR hygiene failed:\n- ${failures.join("\n- ")}`);
            }
