name: Phase 6 Native-backed Cruncher CLI

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_BUILD_JOBS: "4"
  RUST_TEST_THREADS: "2"

permissions:
  contents: read

jobs:
  native-full-cli:
    name: Phase 6 native-backed Cruncher CLI (Windows)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Set up Python
        run: uv python install 3.14
      - name: Sync both public packages
        run: uv sync --all-packages --all-extras
      - name: Restore the exact reviewed corpus ZIP
        shell: pwsh
        run: |
          uv run --extra test python scripts/kicad_corpus_archive.py metadata
          uv run --extra test python scripts/kicad_corpus_archive.py restore --check-zip
          uv run --extra test python scripts/package_kicad_corpus.py --check
          $corpus = Join-Path $env:GITHUB_WORKSPACE 'tests\corpus\kicad.zip'
          if (-not (Test-Path -LiteralPath $corpus -PathType Leaf)) {
            throw "Reviewed corpus ZIP was not restored at $corpus"
          }
          "KM_CORPUS=$corpus" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run the installed native-backed CLI Rack gate
        run: uv run --extra test python tests/rack.py run L3_026
