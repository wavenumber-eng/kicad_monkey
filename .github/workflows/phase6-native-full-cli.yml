name: Phase 6 Native-backed Cruncher CLI

on:
  workflow_call:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_BUILD_JOBS: "4"
  RUST_TEST_THREADS: "2"

permissions:
  contents: read

jobs:
  native-full-cli:
    name: Phase 6 native-backed Cruncher CLI (Windows)
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Set up Python
        run: uv python install 3.14
      - name: Sync both public packages
        run: uv sync --all-packages --all-extras
      - name: Run the installed native-backed CLI Rack gate
        run: uv run --extra test python tests/rack.py run L3_026
