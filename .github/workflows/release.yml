name: Publish coordinated release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type publish to release both tagged Python packages and the Rust CLI
        required: true
        type: choice
        options: [publish]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  resolve:
    name: Resolve the exact successful main candidate
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.release.outputs.run_id }}
      release_sha: ${{ steps.release.outputs.release_sha }}
      monkey_version: ${{ steps.release.outputs.monkey_version }}
      cruncher_version: ${{ steps.release.outputs.cruncher_version }}
      monkey_tag: ${{ steps.release.outputs.monkey_tag }}
      cruncher_tag: ${{ steps.release.outputs.cruncher_tag }}
      monkey_date: ${{ steps.release.outputs.monkey_date }}
      cruncher_date: ${{ steps.release.outputs.cruncher_date }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
      - name: Resolve versions, tags, and CI run
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -euo pipefail
          test "${CONFIRM}" = publish
          test "${GITHUB_REF}" = refs/heads/main
          MONKEY_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          CRUNCHER_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("packages/kicad_cruncher/pyproject.toml","rb"))["project"]["version"])')"
          MONKEY_DATE="$(V="${MONKEY_VERSION}" python -c 'import os, runpy; m=runpy.run_path("src/py/kicad_monkey/_version.py"); print(m["parse_version"](os.environ["V"]).release_date.isoformat())')"
          CRUNCHER_DATE="$(V="${CRUNCHER_VERSION}" python -c 'import os, runpy; m=runpy.run_path("packages/kicad_cruncher/src/py/kicad_cruncher/_version.py"); print(m["parse_version"](os.environ["V"]).release_date.isoformat())')"
          MONKEY_TAG="kicad-monkey-v${MONKEY_VERSION}"
          CRUNCHER_TAG="kicad-cruncher-v${CRUNCHER_VERSION}"
          git fetch --force --tags origin
          test "$(git rev-parse "${MONKEY_TAG}^{commit}")" = "${GITHUB_SHA}"
          test "$(git rev-parse "${CRUNCHER_TAG}^{commit}")" = "${GITHUB_SHA}"

          RUN_ID="$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f branch=main -f status=success -f per_page=100 \
            --jq ".workflow_runs[] | select(.head_sha == \"${GITHUB_SHA}\") | .id" \
            | head -n 1)"
          if [[ -z "${RUN_ID}" ]]; then
            echo "No successful main CI run exists for ${GITHUB_SHA}; rerun full CI before publishing." >&2
            exit 1
          fi
          ARTIFACTS="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')"
          for artifact in \
            phase6-windows-x64-candidates \
            phase7-rust-cli-windows-x64 \
            monkey-universal-candidate; do
            if ! grep -Fx "${artifact}" <<<"${ARTIFACTS}"; then
              echo "CI artifact ${artifact} is absent or expired; rerun full CI for ${GITHUB_SHA}." >&2
              exit 1
            fi
          done

          {
            echo "run_id=${RUN_ID}"
            echo "release_sha=${GITHUB_SHA}"
            echo "monkey_version=${MONKEY_VERSION}"
            echo "cruncher_version=${CRUNCHER_VERSION}"
            echo "monkey_tag=${MONKEY_TAG}"
            echo "cruncher_tag=${CRUNCHER_TAG}"
            echo "monkey_date=${MONKEY_DATE}"
            echo "cruncher_date=${CRUNCHER_DATE}"
          } >> "${GITHUB_OUTPUT}"

  publish-monkey:
    name: Publish exact Monkey candidates
    needs: resolve
    runs-on: ubuntu-latest
    environment: pypi-kicad-monkey
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: phase6-windows-x64-candidates
          path: phase6-candidates
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: monkey-universal-candidate
          path: universal-candidate
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Select the exact tested Monkey files
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          RUN_ID: ${{ needs.resolve.outputs.run_id }}
          MONKEY_VERSION: ${{ needs.resolve.outputs.monkey_version }}
          CRUNCHER_VERSION: ${{ needs.resolve.outputs.cruncher_version }}
        run: |
          python scripts/verify_phase6_release_candidates.py \
            phase6-candidates --git-sha "${RELEASE_SHA}" \
            --run-id "${RUN_ID}" \
            --monkey-version "${MONKEY_VERSION}" --cruncher-version "${CRUNCHER_VERSION}"
          python scripts/universal_release_candidate.py verify \
            universal-candidate --git-sha "${RELEASE_SHA}" \
            --run-id "${RUN_ID}" \
            --expected-version "${MONKEY_VERSION}"
          mkdir -p publish/monkey
          cp phase6-candidates/kicad_monkey-*.tar.gz publish/monkey/
          cp phase6-candidates/kicad_monkey-*-win_amd64.whl publish/monkey/
          cp universal-candidate/kicad_monkey-*-py3-none-any.whl publish/monkey/
          uvx --from twine twine check publish/monkey/*
          python scripts/verify_pypi_release.py kicad-monkey \
            "${MONKEY_VERSION}" publish/monkey --pre-upload --attempts 1
      - name: Publish Monkey to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/monkey/
          skip-existing: true

  verify-public-monkey:
    name: Verify public Monkey before Cruncher
    needs: [resolve, publish-monkey]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: phase6-windows-x64-candidates
          path: phase6-candidates
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: monkey-universal-candidate
          path: universal-candidate
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact public Monkey bytes and installation
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          RUN_ID: ${{ needs.resolve.outputs.run_id }}
          MONKEY_VERSION: ${{ needs.resolve.outputs.monkey_version }}
          CRUNCHER_VERSION: ${{ needs.resolve.outputs.cruncher_version }}
        run: |
          python scripts/verify_phase6_release_candidates.py \
            phase6-candidates --git-sha "${RELEASE_SHA}" \
            --run-id "${RUN_ID}" \
            --monkey-version "${MONKEY_VERSION}" --cruncher-version "${CRUNCHER_VERSION}"
          python scripts/universal_release_candidate.py verify \
            universal-candidate --git-sha "${RELEASE_SHA}" \
            --run-id "${RUN_ID}" --expected-version "${MONKEY_VERSION}"
          mkdir -p expected-monkey
          cp phase6-candidates/kicad_monkey-*.tar.gz expected-monkey/
          cp phase6-candidates/kicad_monkey-*-win_amd64.whl expected-monkey/
          cp universal-candidate/kicad_monkey-*-py3-none-any.whl expected-monkey/
          python scripts/verify_pypi_release.py \
            kicad-monkey "${MONKEY_VERSION}" expected-monkey
          uv venv .public-monkey
          uv pip install --python .public-monkey --no-cache --no-deps \
            "kicad-monkey==${MONKEY_VERSION}"
          .public-monkey/bin/python -I -c \
            'import kicad_monkey; print(kicad_monkey.__version__)'

  publish-cruncher:
    name: Publish exact Python Cruncher candidates
    needs: [resolve, verify-public-monkey]
    runs-on: ubuntu-latest
    environment: pypi-kicad-cruncher
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: phase6-windows-x64-candidates
          path: phase6-candidates
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: phase7-rust-cli-windows-x64
          path: phase7-candidate
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Select and smoke the exact tested Cruncher files
        shell: bash
        env:
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          RUN_ID: ${{ needs.resolve.outputs.run_id }}
          MONKEY_VERSION: ${{ needs.resolve.outputs.monkey_version }}
          CRUNCHER_VERSION: ${{ needs.resolve.outputs.cruncher_version }}
        run: |
          python scripts/verify_phase6_release_candidates.py \
            phase6-candidates --git-sha "${RELEASE_SHA}" \
            --run-id "${RUN_ID}" \
            --monkey-version "${MONKEY_VERSION}" --cruncher-version "${CRUNCHER_VERSION}"
          python scripts/verify_phase7_rust_cli.py phase7-candidate \
            --git-sha "${RELEASE_SHA}" --run-id "${RUN_ID}" \
            --expected-version "${CRUNCHER_VERSION}"
          mkdir -p publish/cruncher
          cp phase6-candidates/kicad_cruncher-* publish/cruncher/
          uvx --from twine twine check publish/cruncher/*
          uv venv .release-smoke
          uv pip install --python .release-smoke --no-cache \
            "kicad-monkey==${MONKEY_VERSION}" publish/cruncher/*.whl
          .release-smoke/bin/kicad-cruncher --version
          .release-smoke/bin/kcr --version
          .release-smoke/bin/python -I -m kicad_cruncher version
          python scripts/verify_pypi_release.py kicad-cruncher \
            "${CRUNCHER_VERSION}" publish/cruncher --pre-upload --attempts 1
      - name: Publish Cruncher to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: publish/cruncher/
          skip-existing: true

  create-releases:
    name: Verify public packages and create releases
    needs: [resolve, publish-cruncher]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.release_sha }}
      - uses: astral-sh/setup-uv@v5
      - uses: actions/download-artifact@v4
        with:
          name: phase6-windows-x64-candidates
          path: phase6-candidates
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: phase7-rust-cli-windows-x64
          path: phase7-candidate
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify exact public Cruncher bytes and create missing GitHub releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.resolve.outputs.release_sha }}
          RUN_ID: ${{ needs.resolve.outputs.run_id }}
          MONKEY_VERSION: ${{ needs.resolve.outputs.monkey_version }}
          CRUNCHER_VERSION: ${{ needs.resolve.outputs.cruncher_version }}
          MONKEY_TAG: ${{ needs.resolve.outputs.monkey_tag }}
          CRUNCHER_TAG: ${{ needs.resolve.outputs.cruncher_tag }}
          MONKEY_DATE: ${{ needs.resolve.outputs.monkey_date }}
          CRUNCHER_DATE: ${{ needs.resolve.outputs.cruncher_date }}
        run: |
          python scripts/verify_phase6_release_candidates.py \
            phase6-candidates --git-sha "${RELEASE_SHA}" \
            --run-id "${RUN_ID}" \
            --monkey-version "${MONKEY_VERSION}" --cruncher-version "${CRUNCHER_VERSION}"
          mkdir -p expected-cruncher
          cp phase6-candidates/kicad_cruncher-* expected-cruncher/
          python scripts/verify_pypi_release.py kicad-cruncher \
            "${CRUNCHER_VERSION}" expected-cruncher
          uv venv .public-cruncher
          uv pip install --python .public-cruncher --no-cache \
            "kicad-monkey==${MONKEY_VERSION}" \
            "kicad-cruncher==${CRUNCHER_VERSION}"
          .public-cruncher/bin/kicad-cruncher --version
          .public-cruncher/bin/kcr --version
          .public-cruncher/bin/python -I -m kicad_cruncher version
          python scripts/verify_phase7_rust_cli.py phase7-candidate \
            --git-sha "${RELEASE_SHA}" --run-id "${RUN_ID}" \
            --expected-version "${CRUNCHER_VERSION}"
          if ! gh release view "${MONKEY_TAG}" >/dev/null 2>&1; then
            gh release create "${MONKEY_TAG}" --verify-tag \
              --title "kicad-monkey ${MONKEY_VERSION}" \
              --notes-file "docs/releases/${MONKEY_DATE}.md"
          fi
          if ! gh release view "${CRUNCHER_TAG}" >/dev/null 2>&1; then
            gh release create "${CRUNCHER_TAG}" --verify-tag \
              --title "kicad-cruncher ${CRUNCHER_VERSION}" \
              --notes-file "packages/kicad_cruncher/docs/releases/${CRUNCHER_DATE}.md"
          fi
          gh release upload "${CRUNCHER_TAG}" phase7-candidate/* --clobber
