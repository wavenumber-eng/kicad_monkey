[project]
name = "kicad-monkey"
version = "2026.8.9"
description = "Core KiCad parser, round-trip, and 2D rendering tooling"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [
    { name = "Wavenumber LLC" },
]
dependencies = [
    "colorama",
    "freetype-py",
    "numpy",
    "shapely",
    "trimesh",
    "uharfbuzz",
    "zstandard",
]

[project.optional-dependencies]
test = [
    "brotli>=1.1.0",
    "fonttools>=4.53.0",
    "jsonschema>=4.22.0",
    "pytest>=8.0.0",
    "pytest-json-report",
    "tomli-w>=1.2.0",
    "wn-rack>=1.1.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
    "twine>=5.0.0",
    "build>=1.2.0",
    "wn-dev-std>=2026.7.18; python_version >= '3.12'",
]

[dependency-groups]
dev = [
    "brotli>=1.1.0",
    "fonttools>=4.53.0",
    "jsonschema>=4.22.0",
    "pytest>=8.0.0",
    "pytest-json-report",
    "tomli-w>=1.2.0",
    "wn-rack>=1.1.0",
    "pyright>=1.1.390",
    "ruff>=0.8.0",
    "twine>=5.0.0",
    "build>=1.2.0",
    "wn-dev-std>=2026.7.18; python_version >= '3.12'",
]

[project.urls]
Homepage = "https://github.com/wavenumber-eng/kicad_monkey"
Repository = "https://github.com/wavenumber-eng/kicad_monkey"
Issues = "https://github.com/wavenumber-eng/kicad_monkey/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.wn_dev_std]
standard_version = "2026.7.18"
enabled_scopes = ["repo", "ci", "docs.design", "docs.links", "docs.plans"]
profile = "python-package"
distribution = "pypi"
languages = ["python"]
strict = true

[tool.wn_dev_std.pr_hygiene]
enabled = true

[tool.uv]
package = true

[tool.uv.workspace]
members = ["packages/kicad_cruncher"]

[tool.hatch.build.targets.wheel]
packages = ["src/py/kicad_monkey"]

[tool.hatch.build.targets.sdist]
include = [
    "assets/**",
    "src/py/**",
    "tests/**",
    "docs/**",
    "scripts/generate_kicad_stroke_font_data.py",
    "tools/generate_kicad_stroke_webfont.py",
    "tools/package_kicad_stroke_webfont_assets.py",
    "README.md",
    "CONTRIBUTING.md",
    "CHANGELOG.md",
    "LICENSE",
    "AGENTS.md",
    "pyproject.toml",
]
exclude = [
    "packages/**",
    "docs/plans/**",
    "docs/research/**",
    "rack_results/**",
    "tests/corpus/**",
    "tests/cross_package/**",
    "tests/**/output/**",
    "**/__pycache__/**",
]

[tool.hatch.version]
path = "src/py/kicad_monkey/_version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src/py", ".."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: long-running test lanes",
]
