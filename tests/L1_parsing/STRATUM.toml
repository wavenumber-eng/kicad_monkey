    "Board net references resolve ordinal-only and name-only encodings against the net table",
    "Exact source spans and unknown top-level forms remain available in source order",
    "Focused property writes preserve untouched bytes and are stable after semantic reparse",
    "Board graphics, routing arcs, dimensions, groups, generated items, and embedded files expose bounded typed iterators",
    "Variants, images, barcodes, tables, and nested table cells expose bounded source-ordered typed iterators",
    "Zones expose Python-parity fill, keepout, placement, per-layer, authored-outline, and filled-polygon semantics",
    "Zone polygon, point, and per-layer-property ceilings fail during lazy decoding before typed collections exceed their limits",
    "Pad/via holes, footprint placement transforms, and board/footprint-local Edge.Cuts carriers are iterable physical facts with explicit coordinate spaces",
    "Footprint profile indexing is bounded before append, while non-profile graphics remain lazily unparsed by the selective profile view",
    "An owned board document exposes bounded native stream I/O and commits source-preserving edits only after semantic reparse",
    "Dependency-aware selected views match full-view pads, zones, holes, profiles, and transforms on both mandatory boards while hiding internal net, footprint, via, and graphic dependencies",
    "Embedded footprint metadata, manufacturing settings, properties, and non-text graphics are bounded, source ordered, parent identified, and selectively equivalent on both mandatory boards",
    "Board setup origins and physical stackup layers expose bounded close-to-format material and electrical semantics with Python corpus parity",
    "Owned failed edits are transactional, unknown forms survive, and repeated writes are stable no-ops",
    "Board properties support ambiguity-safe source-preserving create, update, remove, semantic reparse, CRLF retention, output ceilings, and stable no-ops",
    "Top-level UUID and legacy-ID removal checks all forms, is ambiguity-safe, source preserving, bounded, and idempotent",
    "Identified top-level layer replacement is exact, ambiguity-safe, bounded, and byte stable after semantic reparse",
    "Source, family, nested-object, depth, and output limits fail closed",
    "Lazy typed diagnostics use absolute board-source positions",
]

