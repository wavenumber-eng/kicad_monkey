concerns = ["sexpr", "rust", "schematic", "plotter_ir", "worksheet", "annotations", "graphics", "rule_area", "images", "tables", "symbols", "pins", "occurrences", "hierarchy", "sheets", "sheet_pins", "fonts"]
test_cases = "tests/parity/schematic_plotter_a0_vectors.json"
test_case_type = "contract"

[subtests.objectives]
primary = "Rust and Python emit the same established plotter-IR document through hierarchical schematic sheets without project, worksheet, child-sheet, or font discovery"
secondary = [
    "The strict TypeSpec schematic slice remains a valid subset of the forward-tolerant established plotter-IR contract",
    "A compact custom worksheet proves explicit variables, drawing settings, sheet context, page geometry, connectivity, annotation family order, and operation ordering",
    "The package default worksheet produces an exact header-only document when explicitly selected",
    "A valid PNG worksheet placement and authored transparent junction retain exact image geometry and present-null color semantics",
    "Connectivity records retain Python family ordering, local operation indexes, widths, styles, colors, and geometry defaults",
    "A checked-in fixture font proves exact global-label width, ordinary-text line-height adjustment, and text-box wrapping without ambient fonts",
    "Interleaved source proves canonical polyline, arc, circle, rectangle, Bezier, rule-area, image, and table phases with fill-before-outline operation order",
    "All five rule-area shape carriers preserve nested identity, policy metadata, and closed polyline geometry",
    "Authenticated PNG, JPEG, and BMP payloads prove physical-density scaling and exact retained inline image bytes",
    "Multi-cell tables preserve cell operation grouping, project and built-in variables, hyperlinks, ignored authored caches, and continuous local indexes",
    "The checked-in fixture font also proves exact table-cell wrapping without ambient font lookup",
    "Placed symbols follow tables, preserve occurrence references, unit/style selection, rotation and mirror transforms, visible fields, and project-variable body text",
    "Placed and alternate pins retain balanced typed ownership blocks, library and placed UUIDs, designators, graphics, names, numbers, and drawing-setting pen widths",
    "DNP dimming, exact diagonal markers, overlap bounds, and terminal source-ordered overplots match the Python authority",
    "Sheets declared before symbols in source remain terminal after symbol overplots and preserve source order within the sheet phase",
    "Opaque DNP sheets preserve an undimmed background, dimmed border/pins/fields, and exact terminal markers while transparent sheets duplicate the canonical outline pass and authored negative strokes preserve Python's zero-width border",
    "All nine sheet-pin shapes preserve UUID or derived ownership blocks and continuous operation indexes: the five electrical shapes retain exact decorations while dot, round, diamond, and rectangle retain text-only ownership blocks",
    "Sheet fields preserve show-name and Sheetfile prefixes, hyperlinks, literal project-variable text, hidden and empty omission, while instance variant flags remain outside the plot record",
    "Generated decoding rejects unknown vocabulary, malformed points or images, missing structure, invalid identities, record or operation reordering, mismatched graphics or sheet metadata, malformed sheet-pin blocks and DNP markers, injected table caches, and incorrect counts",
    "The native API consumes caller-owned source, worksheet bytes, variables, drawing settings, sheet context, and font resources without project, path, child-sheet, or font discovery",
    "Native schematic, worksheet, graphic, rule-area, image, table, symbol, pin, library, overlap, hierarchical-sheet, sheet-pin, and sheet-field parsing plus retained text, metadata, records, operations, points, inline bytes, dimensions, pixels, and work fail closed under independent limits",
    "The strict request reserves an independent serialized-output ceiling for the deferred transport adapter",
]

