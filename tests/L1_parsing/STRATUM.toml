# -----------------------------------------------------------------------------

[[subtests]]
id = "L1_022"
file = "test_L1_022_rust_corpus_sexpr_passthrough.py"
name = "Rust Corpus S-Expression Pass-Through"
description = "Run the Rust parser/writer over every promoted KiCad S-expression file"
concerns = ["sexpr", "rust", "performance"]
test_cases = "${WN_TEST_CORPUS}/kicad"
test_case_type = "shared_corpus"

[subtests.objectives]
primary = "Rust parse -> build -> parse preserves every promoted corpus tree with byte-stable second output"
secondary = [
    "All promoted KiCad S-expression suffixes are represented",
    "Real-world projects contribute parser-only evidence",
    "Failures are attributed to read, lex, tree, build, reparse, or compare",
    "Rack writes transient corpus throughput and largest-file evidence",
]

# -----------------------------------------------------------------------------

[[subtests]]
id = "L1_023"
file = "test_L1_023_rust_corpus_performance_memory.py"
name = "Rust Named-Corpus Performance and Peak Memory"
description = "Advisory strict-lane release measurements for hashed small, medium, and large corpus files"
concerns = ["sexpr", "rust", "performance", "memory"]
test_cases = "tests/performance/sexpr_corpus_cases.toml"
test_case_type = "benchmark"

[subtests.objectives]
primary = "Rack records reproducible stage timing and peak RSS evidence for named content-addressed corpus tiers"
secondary = [
    "The benchmark skips in ordinary fast/full development runs",
    "Compilation time is excluded from measurements",
    "Every measured run proves semantic equality and deterministic second output",
    "Host and Rust toolchain identity are recorded",
    "Thresholds remain pending independent Windows and Linux ratification",
]

# -----------------------------------------------------------------------------

[[subtests]]
id = "L1_024"
file = "test_L1_024_rust_selected_span_sort.py"
name = "Rust Selected-Span Sort Measurement"
description = "Advisory strict-lane isolation of final source-order sorting from select-all scans"
concerns = ["sexpr", "rust", "performance", "projection"]
test_cases = "tests/performance/sexpr_corpus_cases.toml"
test_case_type = "benchmark"

[subtests.objectives]
primary = "Measure O(n + k log k) selected-span sorting independently on every named corpus tier"
secondary = [
    "The benchmark skips in ordinary fast/full development runs",
    "Memory and streaming scanners return the same selected-form count",
    "All raw runs and best/median sort fractions are transient evidence",
    "Representation changes remain profiling-driven",
]

# -----------------------------------------------------------------------------

[[subtests]]
id = "L1_025"
file = "test_L1_025_rust_footprint_typed_slice.py"
name = "Rust Typed Footprint Reader/Writer Slice"
description = "Run the source-backed footprint view and focused property writer through Rack"
concerns = ["sexpr", "rust", "footprint", "writeback"]
test_case_type = "contract"

[subtests.objectives]
primary = "A footprint can be read and edited without a generic full-file tree or loss of unknown forms"
secondary = [
    "Name, property, and pad facts are read from selected source spans",
    "Focused property edits preserve untouched bytes and reparse semantically",
    "Only children of the single footprint root contribute typed facts",
    "Lazy diagnostics use absolute source positions",
    "A repeated edit is byte stable",
    "Resource and ambiguity limits fail closed",
]

# -----------------------------------------------------------------------------

[[subtests]]
id = "L1_026"
file = "test_L1_026_rust_footprint_plotter_slice.py"
name = "Rust Footprint Plotter-IR Slice"
description = "Prove the first solid fp_line path from KiCad bytes to kicad.plotter_ir.a0"
concerns = ["sexpr", "rust", "footprint", "plotter_ir", "wasm"]
test_cases = "tests/parity/footprint_plotter_a0_vectors.json"
test_case_type = "contract"

[subtests.objectives]
primary = "Rust and Python emit the same established plotter-IR document for the promoted footprint subset"
secondary = [
    "The TypeSpec slice remains a strict valid subset of the established plotter-IR contract",
    "The core reads selected forms without constructing a generic full-file tree",
    "The WASM boundary accepts source bytes and returns bounded out-of-band JSON bytes",
    "Unsupported geometry and all resource limits fail explicitly",
]
