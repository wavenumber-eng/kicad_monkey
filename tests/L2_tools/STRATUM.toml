# L2_tools Stratum Configuration
# Lower-level tools for KiCad file manipulation
#
# This stratum tests discrete tools that operate on KiCad files:
# extraction, splitting, merging, filters, and file fixes.

name = "Tools"
order = 2
description = "Lower-level tools (extraction, splitting, merging, filters)"
enabled = true
concerns = ["tools", "tools.extraction", "tools.splitting", "tools.merging"]

# Stratum-level objectives
objectives = [
    "Symbol extraction works correctly",
    "Footprint extraction works correctly",
    "Library splitting produces valid individual files",
    "Library merging combines files correctly",
    "Component indexing and lookup works"
]

# =============================================================================
# Code Under Test
# =============================================================================
# This stratum tests tool modules:
#
# Module: kicad_monkey.kicad_symbol_extractor - Extract symbols from .kicad_sch
# Module: kicad_monkey.kicad_symbol_splitter - Split multi-symbol files
# Module: kicad_monkey.kicad_footprint_extractor - Extract footprints from PCB files
# Module: kicad_monkey.kicad_step_extractor - Extract embedded STEP models
# Module: kicad_monkey.kicad_library_extraction - Extract project-local library assets
# Module: kicad_monkey.kicad_name_index - Footprint and symbol name indexing

# =============================================================================
# Subtest Manifest
# =============================================================================
# Tests will be migrated from:
# - legacy/test_kicad_extractors.py
# - legacy/test_kicad_indexing.py

[[subtests]]
file = "test_L2_001_symbol_extraction.py"
name = "Symbol Extraction"
description = "Extract symbols from .kicad_sym files"
test_cases = "${WN_TEST_CORPUS}/kicad/common/board/input/speedy"
test_case_type = "reference"

[subtests.code_under_test]
module = "kicad_monkey.kicad_symbol_extractor"

[subtests.objectives]
primary = "Symbols extracted correctly from library files"

# -----------------------------------------------------------------------------

[[subtests]]
file = "test_L2_002_footprint_extraction.py"
name = "Footprint Extraction"
description = "Extract footprints from projects"
test_cases = "${WN_TEST_CORPUS}/kicad"
test_case_type = "reference"

[subtests.code_under_test]
module = "kicad_monkey.kicad_footprint_extractor"

[subtests.objectives]
primary = "Footprints extracted correctly from projects"

# -----------------------------------------------------------------------------

[[subtests]]
file = "test_L2_003_component_indexing.py"
name = "Component Indexing"
description = "Index and lookup components from PCB"
test_cases = "${WN_TEST_CORPUS}/kicad/common"
test_case_type = "reference"

[subtests.code_under_test]
module = "kicad_monkey.kicad_name_index"

[subtests.objectives]
primary = "Components indexed and looked up correctly"

# -----------------------------------------------------------------------------

[[subtests]]
file = "test_L2_007_library_extraction.py"
name = "Library Extraction"
description = "Extract project-local symbols, footprints, metadata, and embedded STEP models"
test_cases = "${WN_TEST_CORPUS}/kicad/projects/4-ch-backplane"
test_case_type = "real_world"

[subtests.code_under_test]
module = "kicad_monkey.kicad_library_extraction"

[subtests.objectives]
primary = "Project-local KiCad library assets extract into valid inspectable files"

[[subtests]]
id = "L2_009"
file = "test_L2_009_render_cache_oracle.py"
name = "KiCad Render Cache Oracle"
description = "Compare Python and native text render caches with live KiCad save behavior"
concerns = ["tools", "rust", "rendering.text", "parity"]
test_case_type = "oracle"

[subtests.code_under_test]
module = "kicad_monkey.kicad_render_cache"

[subtests.objectives]
primary = "Text render caches match KiCad save-oracle geometry within the accepted tolerance"
secondary = [
    "The native hinted path covers representative line-only, curved, and holed Arial glyphs",
    "Caller-supplied font bytes and fixed face identity drive the native oracle adapter",
      "Plain single-line native cache output stays independently attributable from multiline, markup, and fake-style work",
      "The caller-supplied board text sidecar reaches the same live KiCad cache oracle through the real board carrier",
  ]

[[subtests]]
id = "L2_011"
file = "test_L2_011_stroke_webfont_generator.py"
name = "KiCad Stroke Webfont Generator"
description = "Build and validate Newstroke OpenType/webfont faces, CSS, demo HTML, and CLI behavior"
concerns = ["tools", "assets.fonts", "rendering.text"]
test_case_type = "algorithmic"

[subtests.code_under_test]
module = "tools.generate_kicad_stroke_webfont"

[subtests.objectives]
primary = "Generated font outlines, metrics, weights, italics, CSS, and demo content remain deterministic"
