# -----------------------------------------------------------------------------

[[subtests]]
id = "L3_020"
file = "test_L3_020_rust_schematic_bundle.py"
name = "Rust Schematic Source Bundle"
description = "Compare native named-source hierarchy and connectivity carriers with Python over the compiled-graph reference projects"
concerns = ["rust", "schematic", "source_bundle", "hierarchy", "connectivity"]
test_case_type = "corpus"

[subtests.objectives]
primary = "Native Rust realizes the same schematic definitions and occurrences from named project bytes"
secondary = [
    "Every schematic source is scanned once even when a page is placed repeatedly",
    "Relative child references and inherited sheet policy are deterministic",
    "All four compiled-graph reference projects pass through one native process",
    "Wire, bus, bus-entry, junction, no-connect, and label carriers match Python",
    "Wire components match Python on KiCad's 100-nm schematic grid",
    "Shared decimal vectors fix exact ties-even and signed-IU boundary policy",
    "Hierarchical sheet-pin name, shape, UUID, and position match Python",
    "Placed-symbol source fields, policy, properties, and pin mappings match Python",
    "Modern and legacy symbol instance paths plus variant overlays match Python",
    "Effective per-occurrence symbol references, units, fields, and policy match Python",
    "Top-schematic legacy records resolve distinct repeated child occurrences",
    "Modern suffix compatibility and fallback resolution use bounded indexes rather than occurrence-by-instance scans",
    "Compact modern-instance indexes enforce an aggregate per-source byte allowance at the exact boundary",
    "Embedded library pins, active unit/style selection, and transformed occurrence terminals match Python",
    "Typed bus aliases match Python and bounded native vector/group/alias expansion covers current KiCad syntax",
]

