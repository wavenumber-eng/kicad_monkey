# L0_foundation Stratum Configuration
# S-expression parser and core data structures
#
# This stratum tests the foundational parsing layer that all KiCad file operations
# depend on. S-expressions are the text-based format used by all KiCad files.

name = "Foundation"
order = 0
description = "S-expression parser and core data structures"
enabled = true
concerns = ["sexpr"]

# Stratum-level objectives
objectives = [
    "S-expression parsing works correctly for all KiCad formats",
    "S-expression building produces valid output",
    "Quoted string handling preserves special characters",
    "BoundingBox operations are mathematically correct",
    "SvgRenderContext options work correctly"
]

# =============================================================================
# Code Under Test
# =============================================================================
# This stratum tests the following modules:
#
# Module: kicad_monkey.kicad_sexpr
# Purpose: Parse and build KiCad S-expression format
# Dependencies: None (stdlib only)
#
# Module: kicad_monkey.kicad_geometry
# Purpose: BoundingBox, coordinate utilities, SvgRenderContext
# Dependencies: None (stdlib only)
#
# Module: kicad_monkey.kicad_pcb_base
# Purpose: Base element classes and protocols
# Dependencies: None (stdlib only)

# =============================================================================
# Subtest Manifest
# =============================================================================
# Tests will be added during migration from legacy/test_sexpr.py

[[subtests]]
file = "test_L0_001_sexpr_parsing.py"
name = "S-Expression Parsing"
description = "Parse KiCad S-expression format to nested lists"
test_case_type = "algorithmic"

[subtests.code_under_test]
module = "kicad_monkey.kicad_sexpr"
functions = ["parse_sexp"]

[subtests.objectives]
primary = "Correctly parse all KiCad S-expression variants"
secondary = [
    "Atoms parsed correctly",
    "Strings with spaces handled",
    "Quoted strings preserved",
    "Nested lists parsed recursively",
    "Unicode content supported"
]

[subtests.test_functions]
test_parse_atom = "Parse simple atoms"
test_parse_string = "Parse strings with spaces"
test_parse_quoted = "Parse quoted strings"
test_parse_nested = "Parse nested lists"
test_parse_unicode = "Parse Unicode content"

[[subtests]]
id = "L0_043"
file = "test_L0_043_stroke_font_data_coverage.py"
name = "Newstroke Font Data Coverage"
description = "Validate the vendored non-CJK CC0 Newstroke table and symbol coverage"
concerns = ["rendering.text", "assets.fonts"]
test_case_type = "algorithmic"

[subtests.code_under_test]
module = "kicad_monkey.kicad_stroke_font"

[subtests.objectives]
primary = "The complete U+0020 through U+2BFF Newstroke range decodes without changing legacy glyphs"

[[subtests]]
id = "L0_044"
file = "test_L0_044_rust_sexpr_core.py"
name = "Rust L0 Workspace Tests"
description = "Run the locked Rust core, generated-contract, and adapter unit tests through Rack"
concerns = ["sexpr", "contracts", "wasm"]
test_case_type = "algorithmic"

[subtests.objectives]
primary = "All native Rust L0 workspace tests pass under Rack"
secondary = [
    "Lexer tokens borrow exact source ranges and report byte offsets",
    "Parse -> build -> parse is semantically equal",
    "Deterministic output is stable on the second write",
    "Malformed and resource-limited input fails with structured diagnostics",
]

[[subtests]]
id = "L0_045"
file = "test_L0_045_sexpr_cross_language_vectors.py"
name = "Cross-Language S-Expression Vectors"
description = "Require Python and Rust to consume one language-neutral parser/build vector set"
concerns = ["sexpr"]
test_case_type = "contract"

[subtests.objectives]
primary = "Python and Rust agree on canonical build output and diagnostic phase for the first parser slice"
secondary = [
    "Stable case IDs identify every parity vector",
    "Successful cases are semantically stable on the second write",
    "Failure cases preserve lex/tree phase and message family",
]

[[subtests]]
id = "L0_046"
file = "test_L0_046_rust_l0_signoff.py"
name = "Rust L0 Signoff"
description = "Use Rack to close parity registry, TypeSpec generation, Rust quality, and real WASM smoke gates"
concerns = ["sexpr", "contracts", "wasm"]
test_case_type = "contract"

[subtests.objectives]
primary = "Every required Rust L0 surface has evidence and all generated/native/WASM checks are clean"
secondary = [
    "TypeSpec JSON Schema and generated Rust projections are reproducible",
    "Cargo formatting, checking, and Clippy pass with warnings denied",
    "The WASM target executes a byte-input/byte-output smoke test under Node",
]

[[subtests]]
id = "L0_047"
file = "test_L0_047_rust_sexpr_performance.py"
name = "Rust S-Expression Performance Evidence"
description = "Measure release Rust and Python on one frozen synthetic parser workload"
concerns = ["sexpr", "performance"]
test_case_type = "benchmark"

[subtests.objectives]
primary = "Rack emits reproducible scan, parse, and build evidence before threshold ratification"
secondary = [
    "Python and Rust process byte-identical generated input",
    "Selected form count and deterministic output size agree",
    "Thresholds remain explicitly pending the L0 architecture review",
]
