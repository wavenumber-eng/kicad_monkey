[workspace]
members = [
    "src/rs/kicad-monkey-codegen",
    "src/rs/kicad-monkey-contracts",
    "src/rs/kicad-monkey-core",
    "src/rs/kicad-monkey-wasm",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Wavenumber LLC"]
repository = "https://github.com/wavenumber-eng/kicad_monkey"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
too_many_lines = "deny"

[workspace.dependencies]
anyhow = "1.0.102"
prettyplease = "0.2.37"
schemars = "0.8.22"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision", "preserve_order"] }
sha2 = { version = "0.11.0", default-features = false }
syn = { version = "2.0.117", features = ["full"] }
typify = { version = "0.7.0", default-features = false }
unicode-casefold = "0.2.0"
wasm-bindgen = "0.2.126"
wasm-bindgen-test = "0.3.76"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
