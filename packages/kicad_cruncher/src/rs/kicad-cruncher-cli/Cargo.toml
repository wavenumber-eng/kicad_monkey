[package]
name = "kicad-cruncher-cli"
version = "2026.9.2"
description = "Pure-Rust command-line workflows for KiCad Cruncher"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "kicad-cruncher"
path = "src/main.rs"

[[bin]]
name = "kcr"
path = "src/bin/kcr.rs"

[lints]
workspace = true

[dependencies]
kicad-monkey-contracts = { path = "../../../../../src/rs/kicad-monkey-contracts" }
kicad-monkey-core = { path = "../../../../../src/rs/kicad-monkey-core" }
kicad-monkey-svg = { path = "../../../../../src/rs/kicad-monkey-svg" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
ttf-parser.workspace = true
