name = "Public Workflows"
order = 3
description = "Fixture-backed public CLI workflows using redistributable assets"
enabled = true
concerns = ["cli", "contracts", "release"]

objectives = [
    "Stable public commands run against redistributable KiCad fixtures",
    "Generated outputs have expected schemas, README guidance, and artifact shapes",
    "Workflow tests do not require a private corpus",
    "Copied KiCad Monkey corpus projects exercise real KiCad files",
    "PCB review records distinguish plated and non-plated drill features",
    "PCB SVG workflows exercise config-driven layer outputs and geometer HLR",
    "PCB SVG cutout views detect closed Edge.Cuts circles, rectangles, polygons, lines, arcs, and curves",
    "PCB SVG virtual overlays use the same full-board canvas origin as KiCad Monkey SVG renders",
    "PCB SVG Edge.Cuts loop detection tolerates floating-point arc endpoint noise",
    "PCB SVG layer outputs keep raw physical layers separate from computed virtual layers",
    "PCB SVG physical layer outputs include configurable Edge.Cuts, drill, and slot context overlays",
    "PCB SVG standalone virtual layer files can be disabled independently from physical context overlays",
    "PCB clean dry-run and apply remove configured documentation-layer graphics while preserving copper and hiding Value fields",
]

[dependencies]
strata = ["L0_public_cli"]
note = "A synthetic minimal KiCad project is the first redistributable workflow fixture."

[[subtests]]
id = "L3_001"
file = "test_L3_001_design_workflow.py"
name = "Design And PCB SVG Workflows"
description = "Run design and pcb-svg commands against public KiCad projects and validate outputs"
concerns = ["cli", "contracts", "release"]
test_case_type = "reference"
test_cases = "tmp_path synthetic KiCad project; tests/corpus/kicad/projects/hlr_test; tests/corpus/kicad/projects/taillight/input; tests/corpus/kicad/projects/charge_indicator/input; tests/corpus/kicad/projects/yoshi_mainboard/input; tests/corpus/kicad/projects/speedy_processing_module/input; tests/corpus/kicad/projects/4-ch-backplane/input; tests/corpus/kicad/projects/cutout_test"

[subtests.code_under_test]
module = "kicad_cruncher.kicad_cruncher_cmd_design"
pcb_svg_module = "kicad_cruncher.kicad_cruncher_cmd_pcb_svg"

[subtests.objectives]
design_output = "design writes a KiCad-native JSON artifact and review manifest"
design_review_svgs = "design writes schematic SVGs and PCB copper-layer review SVGs"
design_review_counts = "copied corpus projects have stable component, net, schematic SVG, and PCB SVG counts"
design_aliases = "design-review and dr aliases generate the same review bundle"
auto_detect = "design can auto-detect a single .kicad_pro in CWD"
index_policy = "design honors --no-indexes"
pcb_svg_outputs = "pcb-svg writes manifests, layer SVGs, and configured views"
pcb_svg_hlr = "pcb-svg assembly views include geometer-backed HLR overlays"
review_drill_plating = "design review SVG records keep PTH and NPTH pad drills distinct"
pcb_svg_cutouts = "pcb-svg BOARD_CUTOUTS detects closed Edge.Cuts regions and ignores open shapes"
pcb_svg_alignment = "virtual board outline and cutout overlays align with physical layer SVG content"
pcb_svg_edge_loop_tolerance = "arc/line Edge.Cuts loops survive sampled arc endpoint float noise"
pcb_svg_layer_outputs = "raw physical layer files are distinct from __virtual__ computed layer files"
pcb_svg_layer_context = "physical layer files include configurable raw Edge.Cuts and computed drill/slot context overlays"
pcb_svg_virtual_layer_toggle = "standalone __virtual__ layer output files can be disabled by config"

[subtests.approach]
subprocess_cli = "Invoke public CLI commands through the current Python environment"

[subtests.test_functions]
test_design_command_generates_project_json = "Generate design JSON and review artifacts from a project input"
test_design_aliases_generate_review_bundle = "Generate design review artifacts through public aliases"
test_design_command_uses_copied_kicad_monkey_corpus_projects = "Generate design review artifacts from copied KiCad Monkey corpus projects"
test_design_review_pcb_records_distinguish_pth_and_npth_pads = "Verify review PCB records distinguish PTH and NPTH pads"
test_design_command_can_auto_detect_single_project = "Generate design JSON by auto-detecting one project"
test_design_command_rejects_pcb_only_input = "Reject PCB-only input for schematic-backed design JSON"
test_pcb_svg_command_uses_public_kicad_pcb_with_explicit_config = "Generate PCB SVG layer outputs and a configured view"
test_pcb_svg_layer_context_and_virtual_outputs_can_be_disabled = "Verify physical layer context overlays and standalone virtual outputs can be disabled for raw debugging"
test_pcb_svg_virtual_layers_use_full_board_canvas_origin = "Verify virtual overlays use KiCad Monkey's full-board SVG canvas origin"
test_pcb_svg_yoshi_board_outline_loop_survives_arc_float_noise = "Verify yoshi's arc/line Edge.Cuts profile is the outer board outline"
test_pcb_svg_board_cutouts_detect_generic_internal_closed_regions = "Detect generic closed internal Edge.Cuts regions in a synthetic board"
test_pcb_svg_cutout_project_detects_generalized_edge_cut_regions = "Detect closed cutout primitives in the cutout_test corpus board while ignoring open shapes"
test_pcb_svg_assembly_view_uses_geometer_hlr = "Generate assembly HLR SVG using an embedded STEP model"

[[subtests]]
id = "L3_008"
file = "test_L3_008_native_physical_provider.py"
name = "Native PCB Physical Provider"
description = "Validate the Windows no-fallback native base-SVG provider and transactional publication"
concerns = ["contracts", "rendering", "cross-package", "release"]
test_case_type = "reference"
test_cases = "governed board vectors, mask-view fixture, public design fixture, and synthetic provider failures"

[subtests.code_under_test]
module = "kicad_cruncher.kicad_cruncher_native_physical"
compositor_module = "kicad_cruncher.kicad_cruncher_pcb_svg_compositor"
pcb_svg_module = "kicad_cruncher.kicad_cruncher_cmd_pcb_svg"
design_module = "kicad_cruncher.kicad_cruncher_cmd_design"

[subtests.objectives]
native_only = "A real native render succeeds while both legacy Python render entry points are forbidden"
normalization = "Native nm geometry is adapted to the established mm canvas, enriched record topology, and governed pad-mask view"
cache = "Repeated layer sets reuse one native artifact and bound the sequential per-board root/process and retained-byte work"
failure = "Native failures do not retry through Python and publish no cache entry"
transactions = "Later PCB/design provider failures preserve existing destinations exactly, leave new artifact destinations absent, and retain the intentionally authored input-adjacent pcb-svg config template"

[[subtests]]
id = "L3_010"
file = "test_L3_010_design_cli_compatibility.py"
name = "Design CLI Compatibility"
description = "Validate all public design aliases and entry mechanisms against the exact native-backed bundle contract"
concerns = ["cli", "contracts", "cross-package", "release"]
test_case_type = "reference"
test_cases = "public hlr_test project, real native executable, all three aliases and entry mechanisms, and hostile missing-native failures"

[subtests.code_under_test]
design_module = "kicad_cruncher.kicad_cruncher_cmd_design"
manifest_contract = "docs/contracts/design_review_manifest.a0.schema.json"
entrypoint_module = "kicad_cruncher._cli"

[subtests.objectives]
entrypoints = "kicad-cruncher design, kcr design-review, and python -m kicad_cruncher dr publish byte-identical bundles"
artifacts = "Every published file is indexed and native graph, netlist, and PCB provenance are exact"
exit_codes = "Successful, handled runtime failure, and usage-error invocations return 0, 1, and 2 without tracebacks"
no_partial = "A failed new invocation leaves the requested destination absent"
native_only = "Selected native graph, netlist, and physical rendering never retry through legacy Python builders"

[[subtests]]
id = "L3_009"
file = "test_L3_009_native_design_facts_provider.py"
name = "Native Design Facts Provider"
description = "Validate the Windows no-fallback compiled-graph and version-E netlist provider"
concerns = ["contracts", "connectivity", "cross-package", "release"]
test_case_type = "reference"
test_cases = "synthetic file-backed design, hostile provider failure, public aliases, and real native a1 process"

[subtests.code_under_test]
provider_module = "kicad_cruncher.kicad_cruncher_native_design"
design_module = "kicad_cruncher.kicad_cruncher_cmd_design"
monkey_module = "kicad_monkey.kicad_native"

[subtests.objectives]
native_only = "Selected native facts inject one validated graph and version-E netlist with zero Python graph or netlist-writer retry"
snapshot = "Native result provenance is bound to the exact current in-memory source snapshot and requested netlist metadata"
linkage = "Design JSON, standalone graph, and schematic SVG graph views consume the same injected graph"
transactions = "Native failure preserves the complete previously published design-review tree"
public_cli = "design, design-review, and dr produce deterministic native facts through the real process"

[[subtests]]
id = "L3_011"
file = "test_L3_011_rust_design_cli_compatibility.py"
name = "Rust Design CLI Compatibility"
description = "Keep the pure-Rust design command surface aligned with the canonical Python CLI while implementation slices land"
concerns = ["cli", "contracts", "cross-package", "release"]
test_case_type = "reference"
test_cases = "all three design aliases, command help, invalid-option usage failures, and the public hlr_test project and schematic"

[subtests.code_under_test]
python_entrypoint = "kicad_cruncher._cli"
rust_crate = "src/rs/kicad-cruncher-cli"

[subtests.objectives]
help = "Rust design, design-review, and dr help retain the canonical Python workflow contract"
usage_errors = "Rust aliases return 2 on invalid options, write usage only to stderr, and create no traceback"
netlist_json = "Direct Rust structured facts reproduce Python's exact KiCad-native netlist JSON on the HLR project"
design_json = "Direct Rust facts reproduce exact indexed/no-index HLR Design JSON plus taillight, Yoshi, and large hierarchical 4-channel graph, graphics, multi-unit, and PnP cases"

[[subtests]]
id = "L3_004"
file = "test_L3_004_pcb_clean_workflow.py"
name = "PCB Clean Workflow"
description = "Run pcb clean dry-run and apply against public KiCad fixtures and validate safe cleanup behavior"
concerns = ["cli", "contracts", "release"]
test_case_type = "reference"
